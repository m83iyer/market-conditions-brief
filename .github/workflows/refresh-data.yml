name: Refresh data (self-updating)

on:
  schedule:
    - cron: '7 3 * * 6'  # Saturday 03:07 UTC -- all six source markets closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/fetch_conditions.py
      - run: pytest -q

      - name: Commit the refreshed data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No change in this week's data; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh market conditions data [skip ci]"
          git push
