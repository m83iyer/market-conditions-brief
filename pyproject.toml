[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-conditions-brief"
version = "1.0.0"
description = "Data pipeline for the Market Conditions Brief -- six independently quantified market/macro gauges for US and India, no composite score"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "stockcentric" }]
dependencies = [
  "yfinance>=0.2.66,<2",
  "pandas>=2.0,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest"]
